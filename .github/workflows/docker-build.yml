name: Docker Build

on:
    push:
        branches: [main, master, build-check]
    pull_request:
        branches: [main, master, build-check]
    workflow_dispatch: # Allow manual trigger

env:
    REGISTRY: ghcr.io
    IMAGE_NAME: ${{ github.repository }}

jobs:
    build:
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                environment: [cialabs, atria]
        environment: ${{ matrix.environment }}
        permissions:
            contents: read
            packages: write

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v3

            - name: Log in to Container Registry
              if: github.event_name != 'pull_request'
              uses: docker/login-action@v3
              with:
                  registry: ${{ env.REGISTRY }}
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Extract metadata
              id: meta
              uses: docker/metadata-action@v5
              with:
                  images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
                  tags: |
                      type=ref,event=branch,suffix=-${{ matrix.environment }}
                      type=ref,event=pr,suffix=-${{ matrix.environment }}
                      type=sha,prefix={{branch}}-${{ matrix.environment }}-
                      type=raw,value=${{ matrix.environment }}-latest,enable={{is_default_branch}}

            - name: Build and push Docker image
              uses: docker/build-push-action@v5
              with:
                  context: .
                  file: ./Dockerfile
                  push: ${{ github.event_name != 'pull_request' }}
                  tags: ${{ steps.meta.outputs.tags }}
                  labels: ${{ steps.meta.outputs.labels }}
                  cache-from: type=gha,scope=${{ matrix.environment }}
                  cache-to: type=gha,mode=max,scope=${{ matrix.environment }}
                  platforms: linux/amd64
                  build-args: |
                      NEXT_PUBLIC_APP_URL=${{ vars.NEXT_PUBLIC_APP_URL }}
                      BETTER_AUTH_SECRET=${{ vars.BETTER_AUTH_SECRET }}
